<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caja Central — Tienda Balneario</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ------------------------------------------------------------- login -->
<div id="login" class="hidden">
  <div class="box">
    <div class="logo">
      <span class="mark">C</span>
      <span><span class="t">Caja Central</span><br><span class="s">Tienda Balneario</span></span>
    </div>
    <label class="f">Contraseña de administrador
      <input type="password" id="pw" autocomplete="current-password" autofocus>
    </label>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" id="loginBtn" style="width:100%;height:40px;justify-content:center">Entrar</button>
  </div>
</div>

<!-- -------------------------------------------------------------- shell -->
<div id="app" class="hidden">
  <aside id="rail">
    <div class="logo">
      <span class="mark">C</span>
      <span><span class="t">Caja Central</span><br><span class="s">Tienda Balneario</span></span>
    </div>
    <nav id="nav"></nav>
    <div class="railFoot">
      <div class="syncRow"><span class="dot" id="syncDot"></span><span id="syncTxt">…</span></div>
      <button class="linkBtn" id="refreshBtn">Actualizar ahora</button><br>
      <button class="linkBtn" id="logoutBtn">Cerrar sesión</button>
    </div>
  </aside>

  <div id="main">
    <header id="head">
      <div><h1 id="title">Resumen</h1><div class="sub" id="subtitle"></div></div>
      <span class="spacer"></span>
      <div id="headActions" class="row"></div>
    </header>
    <div id="body"></div>
  </div>
</div>

<div id="toast" class="hidden"></div>
<div id="overlay"></div>

<script src="/static/app.js"></script>
</body>
</html>
